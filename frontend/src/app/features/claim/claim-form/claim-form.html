<div class="page-container">
  <h2 class="page-title">Déclarer un sinistre</h2>

  @if (successMessage()) {
  <div class="alert success">{{ successMessage() }}</div>
  }
  @if (errorMessage()) {
  <div class="alert error">{{ errorMessage() }}</div>
  }

  <form (ngSubmit)="onSubmit()" #claimForm="ngForm">

    <!-- Sélection du Client -->
    <div class="form-group">
      <label for="client">Client <span class="required">*</span></label>
      <select
        id="client"
        name="client"
        class="form-control"
        [(ngModel)]="selectedClientId"
        (ngModelChange)="onClientChange()"
        required>
        <option [ngValue]="null" disabled>Choisir un client</option>
        @for (c of clients(); track c.id) {
        <option [ngValue]="c.id">{{ c.firstName }} {{ c.lastName }}</option>
        }
      </select>
    </div>

    <!-- Sélection du Contrat -->
    <div class="form-group">
      <label for="contract">Contrat <span class="required">*</span></label>
      <select
        id="contract"
        name="contract"
        class="form-control"
        [(ngModel)]="selectedContractId"
        [disabled]="!selectedClientId()"
        required>
        <option [ngValue]="null" disabled>Choisir un contrat</option>
        @for (c of contracts(); track c.id) {
        <option [ngValue]="c.id">{{ c.policyNumber }} ({{ c.type }})</option>
        }
      </select>
    </div>

    <!-- Description -->
    <div class="form-group">
      <label for="description">Description <span class="required">*</span></label>
      <textarea
        id="description"
        name="description"
        class="form-control"
        [(ngModel)]="claim.description"
        required>
      </textarea>
    </div>

    <!-- Date du sinistre -->
    <div class="form-group">
      <label for="claimDate">Date du sinistre <span class="required">*</span></label>
      <input
        type="date"
        id="claimDate"
        name="claimDate"
        class="form-control"
        [(ngModel)]="claim.claimDate"
        required>
    </div>

    <!-- Montant estimé -->
    <div class="form-group">
      <label for="estimatedAmount">Montant estimé (€) <span class="required">*</span></label>
      <input
        type="number"
        id="estimatedAmount"
        name="estimatedAmount"
        class="form-control"
        [(ngModel)]="claim.estimatedAmount"
        required>
    </div>

    <!-- Upload Fichier -->
    <div class="form-group">
      <label>Justificatif (PDF/Image)</label>
      <div class="file-upload">
        <button type="button" class="btn-upload" (click)="fileInput.click()">
          Choisir un fichier
        </button>
        <span class="file-name">{{ fileName() || 'Aucun fichier choisi' }}</span>
        <input #fileInput type="file" (change)="onFileSelected($event)" style="display: none;">
      </div>
    </div>

    <button type="submit" class="btn-submit" [disabled]="!claimForm.valid">Déclarer le sinistre</button>
  </form>
</div>
