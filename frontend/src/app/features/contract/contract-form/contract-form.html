<div class="form-container">
  <div class="header">
    <h2>Nouveau Contrat</h2>
    <a routerLink="/contracts" class="btn-back">Retour</a>
  </div>

  @if (errorMessage) {
  <div class="error-banner">{{ errorMessage }}</div>
  }

  <form (ngSubmit)="onSubmit()" class="contract-card">
    <div class="form-group">
      <label>ID Client</label>
      <input type="number" [(ngModel)]="formData.clientId" name="clientId" required min="1" placeholder="Ex: 1" />
    </div>

    <div class="form-group">
      <label>Type de contrat</label>
      <select [(ngModel)]="formData.type" name="type" required>
        @for (t of types; track t) {
        <option [value]="t">{{ t }}</option>
        }
      </select>
    </div>

    <div class="form-group">
      <label>Date de début</label>
      <input type="date" [(ngModel)]="formData.startDate" name="startDate" required />
    </div>

    <div class="form-group">
      <label>Date de fin</label>
      <input type="date" [(ngModel)]="formData.endDate" name="endDate" required />
    </div>

    <div class="form-group">
      <label>Montant de couverture (€)</label>
      <input type="number" [(ngModel)]="formData.coverageAmount" name="coverageAmount" required min="1" step="0.01" />
    </div>

    <div class="form-group">
      <label>Prime (€)</label>
      <input type="number" [(ngModel)]="formData.premiumAmount" name="premiumAmount" required min="1" step="0.01" />
    </div>

    <button type="submit" class="btn-submit">Créer le contrat</button>
  </form>
</div>
