<div class="dashboard">
  <header class="dash-header">
    <h1>Bonjour, {{ username }}</h1>
    <p>Tableau de bord — Mini API Assurance</p>
  </header>

  <section class="kpi-row">
    <div class="kpi-card stat">
      <span class="kpi-label">Clients</span>
      <span class="kpi-value">{{ totalClients() }}</span>
    </div>
    <div class="kpi-card stat">
      <span class="kpi-label">Contrats</span>
      <span class="kpi-value">{{ totalContracts() }}</span>
    </div>
    <div class="kpi-card stat">
      <span class="kpi-label">Sinistres</span>
      <span class="kpi-value">{{ totalClaims() }}</span>
    </div>
  </section>

  <section class="actions-row">
    <a class="action-card" routerLink="/clients">
      <span class="action-title">Voir les clients</span>
      <span class="action-arrow">→</span>
    </a>
    <a class="action-card" routerLink="/contracts">
      <span class="action-title">Voir les contrats</span>
      <span class="action-arrow">→</span>
    </a>
    <a class="action-card" routerLink="/claims">
      <span class="action-title">Voir les sinistres</span>
      <span class="action-arrow">→</span>
    </a>
  </section>

  <section class="chart-card">
    <h2>Vue d'ensemble</h2>
    <div class="chart-wrap">
      <canvas #globalChart></canvas>
    </div>
  </section>
</div>
